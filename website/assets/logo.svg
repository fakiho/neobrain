<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="neoBrain — a neuron passing memory across a synapse">
  <defs>
    <linearGradient id="nb-soma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c3bfec"/>
      <stop offset="100%" stop-color="#7d77ab"/>
    </linearGradient>
    <linearGradient id="nb-term" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a488b6"/>
      <stop offset="100%" stop-color="#7d77ab"/>
    </linearGradient>
    <radialGradient id="nb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#948ebd" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#948ebd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft aura behind the neuron -->
  <ellipse cx="62" cy="62" rx="52" ry="52" fill="url(#nb-glow)"/>

  <!-- dendrite tree (inputs), bold and short so it survives at small size -->
  <g fill="none" stroke="#4a5064" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 46 54 Q 30 42 18 36" stroke-width="7"/>
    <path d="M 26 39 Q 20 33 12 34" stroke-width="5.5"/>
    <path d="M 18 36 Q 13 30 9 24" stroke-width="5"/>
    <path d="M 44 74 Q 26 82 16 88" stroke-width="7"/>
    <path d="M 24 85 Q 14 92 8 90" stroke-width="5.5"/>
    <path d="M 16 88 Q 12 98 10 104" stroke-width="5"/>
    <!-- a small spine off the soma top -->
    <path d="M 44 42 Q 34 32 30 24" stroke-width="6"/>
  </g>

  <!-- axon: bold long output arcing from the soma to the synapse -->
  <path d="M 58 60 C 76 52, 92 52, 106 45" fill="none" stroke="url(#nb-soma)" stroke-width="10" stroke-linecap="round"/>
  <!-- recall branch -->
  <path d="M 74 58 C 86 64, 96 70, 108 74" fill="none" stroke="#948ebd" stroke-width="6" stroke-linecap="round" opacity="0.95"/>

  <!-- cell body (soma) — the mind -->
  <circle cx="48" cy="62" r="22" fill="url(#nb-soma)"/>
  <circle cx="43" cy="57" r="8" fill="#f0eefd"/>
  <circle cx="41" cy="55" r="3" fill="#948ebd"/>

  <!-- synaptic terminal bouton — the memory connection -->
  <circle cx="108" cy="42" r="14" fill="url(#nb-term)"/>
  <circle cx="104" cy="38" r="4.5" fill="#efe9fb"/>
  <circle cx="108" cy="74" r="8.5" fill="#948ebd"/>
  <circle cx="106" cy="72" r="2.6" fill="#efe9fb"/>

  <!-- vesicle dot in transit along the axon -->
  <circle cx="86" cy="50" r="5" fill="#c3bfec"/>
</svg>
