name: Public hygiene gate

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for private markers
        run: python scripts/check_public_hygiene.py
